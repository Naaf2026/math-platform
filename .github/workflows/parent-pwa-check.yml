name: Parent PWA verification

on:
  pull_request:
    paths:
      - "src/app/parent/app/**"
      - "src/components/parent-pwa-registration.tsx"
      - "src/components/role-navigation.tsx"
      - "public/parent-app*"
      - ".github/workflows/parent-pwa-check.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.15"
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Cloudflare-compatible build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
        run: bun run build:vinext
      - name: Check parent PWA files
        run: |
          test -s public/parent-app.webmanifest
          test -s public/parent-app-sw.js
          test -s src/app/parent/app/page.tsx
          node -e "const m=require('./public/parent-app.webmanifest'); if(m.start_url!=='/parent/app'||m.display!=='standalone')process.exit(1)"
