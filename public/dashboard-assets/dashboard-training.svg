    <rect x="363" y="222" width="7" height="22" rx="3.5" fill="#91bdf0"/>
    <rect x="374" y="214" width="7" height="30" rx="3.5" fill="#6fa8ea"/>
    <rect x="385" y="205" width="7" height="39" rx="3.5" fill="#4f8de0"/>
