<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 417 285" role="img" aria-labelledby="title desc">
  <title id="title">Math training illustration</title>
  <desc id="desc">A student practicing mathematics with a laptop, equations and lesson progress.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#174ea6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b4b78" flood-opacity=".16"/>
    </filter>
  </defs>

  <path d="M46 245c-20-34-16-89 14-131C91 67 140 45 201 42c70-3 130 20 156 62 24 39 10 97-26 126-43 35-112 32-169 28-53-4-96-5-116-13Z" fill="url(#bg)"/>

  <g filter="url(#shadow)">
