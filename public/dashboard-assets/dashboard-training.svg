    <text x="43" y="68" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#214a78">2x + 5 = 13</text>
    <text x="62" y="91" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#2563eb">x = 4</text>
    <circle cx="132" cy="86" r="10" fill="#2fbe83"/>
    <path d="m127 86 4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="278" y="37" width="111" height="52" rx="14" fill="#fff"/>
    <text x="292" y="59" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#42658a">LESSON PROGRESS</text>
    <rect x="292" y="68" width="78" height="8" rx="4" fill="#dcecf7"/>
    <rect x="292" y="68" width="47" height="8" rx="4" fill="#2fbe83"/>
    <text x="374" y="76" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#42658a">3/5</text>
  </g>

  <text x="38" y="143" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#4169df">π</text>
  <path d="M79 137 98 119l18 24H79Z" fill="none" stroke="#4d78e8" stroke-width="2.5"/>
  <text x="84" y="157" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#4d78e8">a</text>
  <text x="101" y="134" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#4d78e8">c</text>
  <text x="98" y="151" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#4d78e8">b</text>

  <text x="278" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5174bd">x = −b ± √(b²−4ac)</text>
  <path d="M311 131h68" stroke="#5174bd" stroke-width="1.5"/>
  <text x="338" y="145" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#5174bd">2a</text>

